name: Trim External Playlist Every 30 Minutes

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Process and Save Playlist
        run: |
          python - << 'EOF'
          import urllib.request

          urls = [
              "https://raw.githubusercontent.com/Prtstream820894/Prmovies/refs/heads/main/playlist.m3u",
              "https://raw.githubusercontent.com/Prtstream820894/Bazeradult/refs/heads/main/playlist.m3u"
          ]

          lines = []

          for url in urls:
              content = urllib.request.urlopen(url).read().decode("utf-8", errors="ignore")
              playlist_lines = content.splitlines()

              if playlist_lines and playlist_lines[0].startswith("#EXTM3U"):
                  playlist_lines = playlist_lines[1:]

              lines.extend(playlist_lines)

          new_lines = []
          group_counts = {}
          header_line = "#EXTM3U"

          i = 0
          while i < len(lines):
              line = lines[i]

              if line.startswith("#EXTINF:"):
                  group_name = "Default"

                  if 'group-title="' in line:
                      try:
                          group_name = line.split('group-title="')[1].split('"')[0]
                      except:
                          pass

                  group_counts[group_name] = group_counts.get(group_name, 0) + 1

                  if group_counts[group_name] <= 5:
                      new_lines.append(line)

                      if i + 1 < len(lines):
                          new_lines.append(lines[i + 1])
                          i += 1

              i += 1

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write(header_line + "\n")
              f.write("\n".join(new_lines))
              f.write("\n")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Auto-trim playlist"
            git push
          fi
